name: Tests

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    - name: Run unit tests
      run: python unit.py
